[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smsledger"
# One version, declared once. src/smsledger/__init__.py holds it, because that is
# the only copy a reader running from a source tree can see; tests/test_version.py
# fails if a second one ever appears here.
dynamic = ["version"]
description = "Turn bank/card SMS and email notifications into ledger rows -- no login, no server (macOS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sms", "email", "personal-finance", "ledger", "macos", "privacy", "korea"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Office/Business :: Financial",
  "Natural Language :: English",
  "Natural Language :: Korean",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/1125yupiter/smsledger"
Issues = "https://github.com/1125yupiter/smsledger/issues"

[project.scripts]
smsledger-doctor = "smsledger.doctor:main"
smsledger-collect = "smsledger.collect:main"
smsledger-parse = "smsledger.parse:main"
smsledger-summary = "smsledger.summary:main"
smsledger-report = "smsledger.report:main"
smsledger-refresh = "smsledger.refresh:main"
smsledger-agent = "smsledger.agent:main"
smsledger-setup = "smsledger.setup:main"
smsledger-support = "smsledger.support:main"

[tool.setuptools.dynamic]
version = { attr = "smsledger.__version__" }

[tool.setuptools.package-data]
smsledger = ["messages/*.json", "examples/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
